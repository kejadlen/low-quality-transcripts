# Curated fixes applied when merging per-episode extractions into the graph.
# Matching ignores case, accents, punctuation, "&" vs "and", and a leading "the".
#
# entities: canonical name => type override and the variants that map to it.
#   Single-word people are dropped unless they're listed here.
# ignore: names that aren't entities at all.

